<!doctype html>
<!-- The disk image's window background, 600 × 470, rendered at 1× and 2× by
     scripts/render.swift. Icon positions are set in scripts/dmg-settings.py
     and must match the gaps left here. -->
<html lang="en">
<meta charset="utf-8">
<style>
  @font-face { font-family: "Literata"; src: url("../../../web/fonts/literata/Literata-VF.ttf"); font-weight: 200 900; }
  @font-face { font-family: "Literata"; src: url("../../../web/fonts/literata/Literata-Italic-VF.ttf"); font-weight: 200 900; font-style: italic; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 600px; height: 470px; background: #FBF8F2; color: #2B2824; font-family: "Literata", serif; overflow: hidden; }
  h1 { position: absolute; top: 30px; width: 100%; text-align: center; font-size: 21px; font-weight: 500; letter-spacing: -0.005em; }
  /* The arrow sits between the app (x 150) and Applications (x 450), at icon height (y 160). */
  svg { position: absolute; left: 236px; top: 145px; }
  .note { position: absolute; left: 0; right: 0; top: 246px; text-align: center; font-size: 12px; line-height: 1.45; color: #6E675E; font-style: italic; }
</style>
<h1>Drag Leading into Applications</h1>
<svg width="128" height="30" viewBox="0 0 128 30" fill="none" stroke="#2B2824" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
  <path d="M4 15 H120 M108 5 L121 15 L108 25"/>
</svg>
<p class="note">The first time you open it, macOS may say it could not verify Leading.<br>The guide below shows the one-minute fix.</p>
