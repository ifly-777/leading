# Every push: type-check and test the web side on Linux (cheap and fast).
# The Mac build runs in release.yml, on demand, to save macOS minutes.
name: CI
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      # Browser tests in WebKit. The speed benchmark is skipped: shared CI
      # machines make its timings meaningless.
      - run: npx playwright install --with-deps webkit
      - run: npm run stress && npx playwright test --grep-invert "5 MB stress file"
