# Builds Leading.app (Apple Silicon + Intel), signs it ad hoc, and packs a DMG.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.2.0 to
# also draft a GitHub Release with the DMG attached.
#
# Signing later: add repository secrets SIGNING_IDENTITY (and the certificate)
# and the same scripts produce a Developer ID signature; notarisation would be
# one more step here. No restructuring needed.
name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Swift tests
        working-directory: mac
        run: swift test
      - name: Build the app
        run: scripts/build-app.sh
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
      - name: Make the DMG
        run: scripts/make-dmg.sh
      - name: Check the signature and architectures
        run: |
          codesign --verify --strict --verbose=2 build/Leading.app
          lipo -archs build/Leading.app/Contents/MacOS/Leading
      - uses: actions/upload-artifact@v4
        with:
          name: Leading-dmg
          path: build/*.dmg
          retention-days: 30
      - name: Draft a release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" build/*.dmg --draft --title "Leading $GITHUB_REF_NAME" --notes "Draft release; notes to follow."
