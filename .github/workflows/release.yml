# Builds Leading.app (Apple Silicon + Intel), signs it ad hoc, and packs the
# DMG, on a clean Mac. Run it from the Actions tab ("Run workflow") to check
# that a release builds from the repository alone.
#
# Releases themselves are made by scripts/release.sh on the release Mac, since
# the update-signing key lives only in that Mac's Keychain.
#
# Signing later: add repository secrets SIGNING_IDENTITY (and the certificate)
# and the same scripts produce a Developer ID signature; notarisation would be
# one more step here. No restructuring needed.
name: Release
on:
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Sparkle (downloaded and checksum-verified)
        run: scripts/fetch-sparkle.sh
      - name: Swift tests
        working-directory: mac
        run: swift test
      - name: Build the app
        run: scripts/build-app.sh
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
      # dmgbuild, which lays out the DMG window, needs Python 3.10 or later.
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Make the DMG
        run: scripts/make-dmg.sh
      - name: Check the signature and architectures
        run: |
          codesign --verify --strict --verbose=2 build/Leading.app
          lipo -archs build/Leading.app/Contents/MacOS/Leading
      - uses: actions/upload-artifact@v4
        with:
          name: Leading-dmg
          path: build/*.dmg
          retention-days: 30
